name: Docker build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: zeroclaw-railway-browser:ci
      - name: Verify browser runtime as non-root
        run: |
          docker run --rm --user 65534:65534 --entrypoint sh zeroclaw-railway-browser:ci -ec '
            test -x "$(cat /etc/agent-browser-chrome-path)"
            test -x "$(command -v agent-browser)"
            test -w /tmp/agent-browser-sockets || mkdir -p /tmp/agent-browser-sockets
            agent-browser --version
            node --version
          '
      - name: Inspect image
        run: docker image inspect zeroclaw-railway-browser:ci
